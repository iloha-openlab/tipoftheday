name: Check

on:
  pull_request:
  push:
    branches:
      - main
      - 'releases/**'
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history and tags for versioning
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install X11 and font packages for Swing tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libsm6 libxrender1 libxext6 libxtst6 libxcb1 fonts-dejavu-core xfonts-base
      - name: Build and test
        run: xvfb-run -a --server-args='-screen 0 1024x768x24' ./gradlew --no-daemon clean check integrationTest
