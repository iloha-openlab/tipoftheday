[versions]
slf4j = "2.0.7"
junit = "5.12.1"
swingbox = "1.2.8"
sphinx = "1.0.4"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
swingbox = {group = "tokyo.northside", name = "swingbox", version.ref = "swingbox"}
assertj-swing-junit = {group = "tokyo.northside", name = "assertj-swing-junit", version = "4.0.0-beta-2"}
slf4j-jdk14 =  {group = "org.slf4j", name = "slf4j-jdk14",  version.ref = "slf4j"}

[plugins]
spotbugs = {id = "com.github.spotbugs", version = "6.1.3"}
spotless = {id = "com.diffplug.spotless", version = "7.0.2"}
git-version = {id = "com.palantir.git-version", version = "3.2.0"}
nexus-publish = {id = "io.github.gradle-nexus.publish-plugin", version = "2.0.0"}
sphinx = {id = "tokyo.northside.sphinx", version.ref = "sphinx"}
