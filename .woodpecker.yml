
branches: [main]

pipeline:
  fetch:
    image: drone/git
    settings:
      depth: 1
      tags: true
  build:
    image: ubuntu:latest
    pull: true
    commands: |
      apt-get update && apt-get install -y openjdk-17-jdk libicu-dev libcurl4-openssl-dev libjansson-dev
      ./gradlew clean printVersion build

