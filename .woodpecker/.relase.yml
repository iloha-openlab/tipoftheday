when:
  - event: tag
    ref: refs/tags/v*

depends_on:
  - check

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 1
      lfs: false
      tags: true

steps:
  build:
    image: adoptopenjdk/openjdk11:alpine
    commands:
      - export ORG_GRADLE_PROJECT_signingKey=$${GPG_SECRET_KEY}
      - export ORG_GRADLE_PROJECT_signingPassword=$${GPG_KEY_PASSPHARASE}
      - ./gradlew --no-daemon clean publish
    environment:
      GPG_SECRET_KEY:
        from_secret: gpg_secret_key
      GPG_SECRET_PASSPHRASE:
        from_secret: gpg_key_passphrase
      SONATYPE_USER:
        from_secret: sonatype_user
      SONATYPE_PASS:
        from_secret: sonatype_pass
